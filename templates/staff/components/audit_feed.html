{# Audit timeline rows — rendered in the dashboard and re-fetched every 30s #}
{% if audit_feed %}
  <ol class="relative space-y-5 before:absolute before:bottom-2 before:left-[5px] before:top-2 before:w-px before:bg-slate-200">
    {% for item in audit_feed %}
      <li class="relative flex items-start justify-between gap-3 pl-6">
        <span class="absolute left-0 top-1.5 h-[11px] w-[11px] rounded-full ring-2 ring-white
                     {% if item.tone == 'green' %}bg-emerald-500{% elif item.tone == 'red' %}bg-rose-500{% else %}bg-blue-500{% endif %}"></span>
        <div class="min-w-0">
          <p class="truncate text-sm font-semibold text-slate-900">{{ item.title }}</p>
          <p class="text-xs font-medium text-blue-600">{{ item.actor }}</p>
        </div>
        <span class="flex shrink-0 items-center gap-1 text-xs text-slate-500">
          <svg class="h-4 w-4 text-brand" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          {{ item.created_at|timesince }} ago
        </span>
      </li>
    {% endfor %}
  </ol>
{% else %}
  <p class="py-6 text-center text-sm text-slate-500">No governance activity yet.</p>
{% endif %}
