{# Left navigation — Alpha Orange branded rail #}
<aside class="hidden w-64 shrink-0 flex-col border-r border-slate-200 bg-white text-slate-800 lg:flex">
  <div class="border-b border-slate-200 px-5 py-5">
    <p class="text-lg font-bold tracking-tight text-brand">{{ brand.name|lower }}</p>
    <p class="mt-0.5 text-xs font-medium text-slate-500">{{ brand.tagline }}</p>
  </div>

  <nav class="flex-1 space-y-1 px-3 py-4" aria-label="Main">
    {% for item in nav_items %}
      {% url item.url_name as item_url %}
      <a
        href="{{ item_url }}"
        class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium transition
               {% if request.path == item_url %}
                 bg-brand text-white shadow-sm
               {% else %}
                 text-slate-600 hover:bg-brand-50 hover:text-slate-900
               {% endif %}"
      >
        <span class="inline-flex h-5 w-5 items-center justify-center rounded-md bg-black/5 text-[10px] uppercase
                     {% if request.path == item_url %}bg-white/20{% endif %}">
          {{ item.icon|slice:":1" }}
        </span>
        {{ item.label }}
      </a>
    {% endfor %}
  </nav>

  <div class="border-t border-slate-200 px-5 py-4 text-xs text-slate-500">
    ISO 9001 · {{ brand.legal_name }}
  </div>
</aside>
