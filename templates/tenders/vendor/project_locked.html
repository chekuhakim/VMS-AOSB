{% extends "base.html" %}

{% block content %}
  <div class="mx-auto max-w-xl rounded-2xl border border-slate-200/80 bg-white p-8 text-center shadow-sm">
    <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-slate-100 text-slate-500">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>
    </div>
    <h1 class="mt-4 text-xl font-bold text-slate-900">Projects are locked</h1>
    <p class="mt-2 text-sm text-slate-600">
      {{ company.name }} can view and quote on projects once its Envelope 1 has been approved by Alpha Orange.
    </p>
    <a href="{% url 'envelope1:home' %}" class="mt-6 inline-flex rounded-xl bg-brand px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-brand-700">Go to Envelope 1</a>
  </div>
{% endblock %}
