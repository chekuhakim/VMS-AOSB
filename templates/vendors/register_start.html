{% extends "base.html" %}

{% block content %}
  <div class="mx-auto max-w-lg rounded-xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
    <h2 class="text-lg font-semibold text-slate-900">Start company registration</h2>
    <p class="mt-2 text-sm text-slate-600">
      Enter the registered company name to create a draft, then complete the 6-step wizard.
    </p>
    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      <div>
        <label for="id_name" class="block text-sm font-medium text-slate-600">Registered company name</label>
        <input type="text" name="name" id="id_name" required
          class="mt-1.5 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm shadow-sm focus:border-brand focus:outline-none focus:ring-1 focus:ring-brand"
          placeholder="e.g. Acme Tower Services Sdn Bhd">
      </div>
      <button type="submit" class="w-full rounded-xl bg-brand px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-brand-700">
        Continue to step 1
      </button>
    </form>
  </div>
{% endblock %}
