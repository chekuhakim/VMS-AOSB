{% extends "vendors/base_wizard.html" %}

{% block head_title %}Register company{% endblock %}

{% block wizard_content %}
  <div class="mx-auto max-w-lg">
    <div class="mb-6 text-center sm:text-left">
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">Register your company</h1>
      <p class="mt-2 text-sm text-slate-600">
        Enter the registered company name to create a draft, then complete the 6-step wizard.
      </p>
    </div>
    <div class="rounded-2xl border border-slate-200/80 bg-white p-6 shadow-sm sm:p-8">
      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label for="id_name" class="block text-sm font-medium text-slate-700">
            Registered company name <span class="text-rose-600" aria-hidden="true">*</span>
          </label>
          <input
            type="text"
            name="name"
            id="id_name"
            required
            value=""
            class="mt-1.5 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm shadow-sm focus:border-brand focus:outline-none focus:ring-1 focus:ring-brand"
            placeholder="e.g. Cahaya Sdn Bhd"
          />
        </div>
        <button
          type="submit"
          class="w-full rounded-xl bg-brand px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-brand-700"
        >
          Continue to step 1
        </button>
      </form>

      <p class="mt-4 text-center text-sm text-slate-500">
        <a href="{% url 'vendors:your_company' %}" class="font-medium text-brand hover:text-brand-700">
          Back to your companies
        </a>
      </p>
    </div>
  </div>
{% endblock %}
