{% extends "base.html" %}

{% block content %}
  <div class="rounded-xl border border-slate-200 bg-white p-8 shadow-sm">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h2 class="text-lg font-semibold text-slate-950">{{ page_title }}</h2>
        <p class="mt-2 max-w-2xl text-sm text-slate-600">{{ message }}</p>
      </div>
      {% include "components/status_badge.html" with label="Not built yet" tone="warning" %}
    </div>
    <a
      href="{% url 'core:dashboard' %}"
      class="mt-6 inline-flex items-center rounded-xl bg-brand px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-brand-700"
    >
      Back to dashboard
    </a>
  </div>
{% endblock %}
