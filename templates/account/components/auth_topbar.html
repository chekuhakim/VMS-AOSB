{% load static %}
<header class="bg-cream border-b border-slate-200/80">
  <div class="flex h-16 items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
    <div class="flex min-w-0 items-center gap-3 sm:gap-4">
      <a href="{% url 'account_login' %}" class="shrink-0">
        <img src="{% static 'brand/logo.webp' %}" alt="{{ brand.name }}" class="h-10 w-auto sm:h-11" />
      </a>
      <p class="truncate text-sm text-slate-700 sm:text-base">
        <span class="font-semibold text-slate-900">{{ brand.tagline }}</span>
        <span class="ml-2 font-light text-slate-500">{{ brand.legal_name }}</span>
      </p>
    </div>
    <a
      href="#faq"
      class="bg-brand-50 text-brand ring-brand/20 hover:bg-brand-100 inline-flex shrink-0 items-center gap-1.5 rounded-full px-4 py-2 text-sm font-medium ring-1 ring-inset"
    >
      FAQ
      <svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path
          fill-rule="evenodd"
          d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z"
          clip-rule="evenodd"
        />
      </svg>
    </a>
  </div>
</header>
