{% extends "account/base_auth.html" %}

{% block head_title %}Password updated{% endblock %}

{% block auth_content %}
  <h1 class="text-xl font-semibold text-slate-900">Password updated</h1>
  <p class="mt-2 text-sm text-slate-600">Your password has been changed. You can sign in now.</p>
  <a href="{% url 'account_login' %}" class="mt-6 inline-flex w-full items-center justify-center rounded-xl bg-brand px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-brand-700">
    Sign in
  </a>
{% endblock %}
