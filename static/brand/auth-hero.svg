<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Telecom tower landscape">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="45%" stop-color="#3d2c29"/>
      <stop offset="100%" stop-color="#6b4423"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d4c4b0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c4b5a0" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1200" fill="url(#sky)"/>
  <!-- Ridges -->
  <path d="M0 720 L180 640 L320 700 L480 580 L620 660 L780 540 L900 620 L900 1200 L0 1200 Z" fill="#2a241f"/>
  <path d="M0 820 L220 740 L400 800 L560 700 L720 780 L900 720 L900 1200 L0 1200 Z" fill="#3a322c"/>
  <!-- Tower -->
  <g stroke="#e8e0d8" stroke-width="3" fill="none">
    <line x1="450" y1="280" x2="450" y2="720"/>
    <line x1="450" y1="320" x2="390" y2="380"/>
    <line x1="450" y1="320" x2="510" y2="380"/>
    <line x1="450" y1="400" x2="370" y2="500"/>
    <line x1="450" y1="400" x2="530" y2="500"/>
    <line x1="450" y1="500" x2="360" y2="620"/>
    <line x1="450" y1="500" x2="540" y2="620"/>
    <line x1="390" y1="380" x2="510" y2="380"/>
    <line x1="370" y1="500" x2="530" y2="500"/>
    <line x1="360" y1="620" x2="540" y2="620"/>
  </g>
  <circle cx="450" cy="270" r="8" fill="#FF6F00"/>
  <rect width="900" height="1200" fill="url(#fog)"/>
</svg>
